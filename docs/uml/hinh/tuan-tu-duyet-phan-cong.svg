-end="url(#arrow)"/><text x="855.0" y="366.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#1f2937">onOrderStatusChanged(event</text><text x="855.0" y="378.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#1f2937">)</text><polyline points="937.5,442.0 1098.5,442.0" fill="none" stroke="#374151" stroke-width="1.3" marker-end="url(#arrow)"/><text x="1020.0" y="412.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#1f2937">ca còn mở hôm nay của</text><text x="1020.0" y="424.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#1f2937">tuyến lấy hàng, người trực</text><text x="1020.0" y="436.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#1f2937">ca</text><polyline points="937.5,530.0 1098.5,530.0" fill="none" stroke="#374151" stroke-width="1.3" marker-end="url(#arrow)"/><text x="1020.0" y="488.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#1f2937">transaction:</text><text x="1020.0" y="500.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#1f2937">Shift.assignSeq += 1 (khóa</text><text x="1020.0" y="512.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#1f2937">ca) → đếm tải → chọn người</text><text x="1020.0" y="524.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#1f2937">ít đơn nhất</text><polyline points="937.5,576.0 1098.5,576.0" fill="none" stroke="#374151" stroke-width="1.3" marker-end="url(#arrow)"/><text x="1020.0" y="558.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#1f2937">Order → PICKUP_ASSIGNED;</text><text x="1020.0" y="570.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#1f2937">Assignment AUTO</text><polyline points="937.5,610.0 611.5,610.0" fill="none" stroke="#374151" stroke-width="1.3" marker-end="url(#open)"/><text x="772.5" y="604.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#1f2937">publish(order.status.changed)</text><polyline points="937.5,668.0 1098.5,668.0" fill="none" stroke="#374151" stroke-width="1.3" marker-end="url(#arrow)"/><text x="1020.0" y="638.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#1f2937">đơn giữ CONFIRMED, ghi</text><text x="1020.0" y="650.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#1f2937">unassignedReason (hàng</text><text x="1020.0" y="662.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#1f2937">chờ)</text><rect x="12" y="472" width="1191" height="236" fill="none" stroke="#7c3aed" stroke-width="1.2"/><path d="M12,472 h40 v12 l-8,8 h-32 z" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.1"/><text x="18.0" y="486.0" font-size="11" font-weight="700" text-anchor="start" fill="#7c3aed">alt</text><text x="60.0" y="486.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#7c3aed" font-style="italic">[có người trực ca chưa đầy năng lực]</text><line x1="12" y1="630" x2="1203" y2="630" stroke="#7c3aed" stroke-width="1" stroke-dasharray="6 4"/><text x="18.0" y="643.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#7c3aed" font-style="italic">[không có ca / tất cả đã đầy]</text></svg>