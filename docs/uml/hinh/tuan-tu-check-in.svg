ke-width="1.3"/><polyline points="103.5,34.0 121.5,34.0" fill="none" stroke="#1f2937" stroke-width="1.3"/><polyline points="104.5,51.0 112.5,41.0 120.5,51.0" fill="none" stroke="#1f2937" stroke-width="1.3"/><text x="112.5" y="65.8" font-size="11" font-weight="600" text-anchor="middle" fill="#1f2937">Người giao hàng</text><rect x="203.0" y="18" width="149" height="27" rx="5" fill="#eef5ff" stroke="#374151" stroke-width="1.2"/><text x="277.5" y="35.4" font-size="11" font-weight="600" text-anchor="middle" fill="#1f2937">App Nhân viên (tài xế)</text><rect x="368.0" y="18" width="149" height="40" rx="5" fill="#f3e8ff" stroke="#374151" stroke-width="1.2"/><text x="442.5" y="35.0" font-size="11" font-weight="600" text-anchor="middle" fill="#1f2937">Hàng đợi trên máy</text><text x="442.5" y="48.7" font-size="11" font-weight="600" text-anchor="middle" fill="#1f2937">(AsyncStorage)</text><rect x="533.0" y="18" width="149" height="27" rx="5" fill="#fffbeb" stroke="#374151" stroke-width="1.2"/><text x="607.5" y="35.4" font-size="11" font-weight="600" text-anchor="middle" fill="#1f2937">CheckinService</text><rect x="698.0" y="18" width="149" height="40" rx="5" fill="#ecfdf5" stroke="#374151" stroke-width="1.2"/><text x="772.5" y="35.0" font-size="11" font-weight="600" text-anchor="middle" fill="#1f2937">MongoDB (checkinPoints,</text><text x="772.5" y="48.7" font-size="11" font-weight="600" text-anchor="middle" fill="#1f2937">checkinLogs)</text><rect x="863.0" y="18" width="149" height="27" rx="5" fill="#fffbeb" stroke="#374151" stroke-width="1.2"/><text x="937.5" y="35.4" font-size="11" font-weight="600" text-anchor="middle" fill="#1f2937">Worker → JourneyService</text><circle cx="1102.5" cy="22" r="7" fill="#fff" stroke="#1f2937" stroke-width="1.4"/><polyline points="1102.5,29.0 1102.5,41.0" fill="none" stroke="#1f2937" stroke-width="1.3"/><polyline points="1093.5,34.0 1111.5,34.0" fill="none" stroke="#1f2937" stroke-width="1.3"/><polyline points="1094.5,51.0 1102.5,41.0 1110.5,51.0" fill="none" stroke="#1f2937" stroke-width="1.3"/><text x="1102.5" y="65.8" font-size="11" font-weight="600" text-anchor="middle" fill="#1f2937">Người nhận</text><polyline points="112.5,112.0 273.5,112.0" fill="none" stroke="#374151" stroke-width="1.3" marker-end="url(#arrow)"/><text x="195.0" y="94.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#1f2937">Đi tới điểm (vị trí giả</text><text x="195.0" y="106.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#1f2937">lập)</text><polyline points="277.5,146.0 603.5,146.0" fill="none" stroke="#374151" stroke-width="1.3" marker-end="url(#arrow)"/><text x="442.5" y="140.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#1f2937">POST /checkins { lat, lng, at, clientEventId }</text><polyline points="607.5,186.0 641.5,186.0 641.5,202.0 611.5,202.0" fill="none" stroke="#374151" stroke-width="1.3" marker-end="url(#arrow)"/><text x="647.5" y="184.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#1f2937">điểm trong bán kính</text><text x="647.5" y="196.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#1f2937">(haversine ≤ 150 m)</text><polyline points="607.5,282.0 768.5,282.0" fill="none" stroke="#374151" stroke-width="1.3" marker-end="url(#arrow)"/><text x="690.0" y="252.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#1f2937">bỏ qua nếu cùng điểm + đơn</text><text x="690.0" y="264.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#1f2937">trong 30 phút; ghi</text><text x="690.0" y="276.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#1f2937">CheckinLog</text><polyline points="607.5,316.0 933.5,316.0" fill="none" stroke="#374151" stroke-width="1.3" marker-end="url(#open)"/><text x="772.5" y="310.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#1f2937">order.checkin.recorded → dựng lại hành trình</text><polyline points="277.5,380.0 438.5,380.0" fill="none" stroke="#374151" stroke-width="1.3" marker-end="url(#arrow)"/><text x="360.0" y="362.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#1f2937">lưu sự kiện (thời điểm</text><text x="360.0" y="374.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#1f2937">gốc, mã sự kiện)</text><polyline points="442.5,426.0 603.5,426.0" fill="none" stroke="#374151" stroke-width="1.3" marker-end="url(#arrow)"/><text x="525.0" y="408.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#1f2937">có mạng: gửi lại — trùng</text><text x="525.0" y="420.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#1f2937">mã sự kiện thì bỏ</text><polyline points="1102.5,484.0 941.5,484.0" fill="none" stroke="#374151" stroke-width="1.3" marker-end="url(#arrow)"/><text x="1020.0" y="454.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#1f2937">GET /tracking/:code → các</text><text x="1020.0" y="466.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#1f2937">điểm đã qua (không lộ tọa</text><text x="1020.0" y="478.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#1f2937">độ)</text><rect x="12" y="236" width="1191" height="62" fill="none" stroke="#7c3aed" stroke-width="1.2"/><path d="M12,236 h48 v12 l-8,8 h-40 z" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.1"/><text x="18.0" y="250.0" font-size="11" font-weight="700" text-anchor="start" fill="#7c3aed">loop</text><text x="68.0" y="250.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#7c3aed" font-style="italic">[mỗi điểm × đơn đang chở]</text><rect x="12" y="346" width="1191" height="96" fill="none" stroke="#7c3aed" stroke-width="1.2"/><path d="M12,346 h40 v12 l-8,8 h-32 z" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.1"/><text x="18.0" y="360.0" font-size="11" font-weight="700" text-anchor="start" fill="#7c3aed">opt</text><text x="60.0" y="360.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#7c3aed" font-style="italic">[mất mạng]</text></svg>