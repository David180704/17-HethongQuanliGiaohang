#b45309" stroke-width="1.3"/><text x="414.0" y="172.1" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1f2937">Trả danh sách đơn</text><text x="414.0" y="187.6" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1f2937">của chính khách, mới</text><text x="414.0" y="203.1" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1f2937">nhất trước, có phân</text><text x="414.0" y="218.6" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1f2937">trang</text><rect x="24.0" y="250.0" width="160" height="74.0" rx="11" fill="#fffbeb" stroke="#b45309" stroke-width="1.3"/><text x="104.0" y="268.1" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1f2937">Lọc theo nhóm trạng</text><text x="104.0" y="283.6" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1f2937">thái, khoảng ngày</text><text x="104.0" y="299.1" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1f2937">tạo; tìm mã vận đơn</text><text x="104.0" y="314.6" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1f2937">hoặc người nhận</text><rect x="334.0" y="346.0" width="160" height="74.0" rx="11" fill="#fffbeb" stroke="#b45309" stroke-width="1.3"/><text x="414.0" y="364.1" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1f2937">Hiển thị nhóm trạng</text><text x="414.0" y="379.6" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1f2937">thái (4 nhóm của đề</text><text x="414.0" y="395.1" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1f2937">14) kèm tên trạng</text><text x="414.0" y="410.6" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1f2937">thái chi tiết</text><polygon points="414,449.0 427,462.0 414,475.0 401,462.0" fill="#ffffff" stroke="#374151" stroke-width="1.4"/><rect x="503.0" y="497.0" width="128" height="41" rx="11" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/><text x="567.0" y="514.2" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937">Danh sách trống,</text><text x="567.0" y="529.2" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937">gợi ý bỏ lọc</text><rect x="24.0" y="560.0" width="160" height="34" rx="11" fill="#fffbeb" stroke="#b45309" stroke-width="1.3"/><text x="104.0" y="581.4" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1f2937">Chọn một đơn</text><polygon points="414,637.0 427,650.0 414,663.0 401,650.0" fill="#ffffff" stroke="#374151" stroke-width="1.4"/><rect x="503.0" y="685.0" width="128" height="41" rx="11" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/><text x="567.0" y="702.2" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937">Báo không tìm</text><text x="567.0" y="717.2" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937">thấy (404)</text><circle cx="567" cy="760.0" r="11" fill="#ffffff" stroke="#111827" stroke-width="1.6"/><circle cx="567" cy="760.0" r="6.5" fill="#111827"/><rect x="334.0" y="794.0" width="160" height="74.0" rx="11" fill="#fffbeb" stroke="#b45309" stroke-width="1.3"/><text x="414.0" y="812.1" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1f2937">Hiển thị người nhận,</text><text x="414.0" y="827.6" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1f2937">hàng, phí đã khóa,</text><text x="414.0" y="843.1" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1f2937">thu hộ và các mốc</text><text x="414.0" y="858.6" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1f2937">hành trình</text><circle cx="414" cy="902.0" r="11" fill="#ffffff" stroke="#111827" stroke-width="1.6"/><circle cx="414" cy="902.0" r="6.5" fill="#111827"/></svg>