ợc lại]</text><polyline points="414.0,562.5 414.0,605.5" fill="none" stroke="#374151" stroke-width="1.3" marker-end="url(#arrow)"/><polyline points="414.0,631.5 414.0,716.5" fill="none" stroke="#374151" stroke-width="1.3" marker-end="url(#arrow)"/><text x="420.0" y="645.5" font-size="11.5" font-weight="400" text-anchor="start" fill="#374151" font-style="italic">[ngược lại]</text><polyline points="414.0,806.0 414.0,828.0" fill="none" stroke="#374151" stroke-width="1.3" marker-end="url(#arrow)"/><polyline points="414.0,917.5 414.0,939.5" fill="none" stroke="#374151" stroke-width="1.3" marker-end="url(#arrow)"/><polyline points="427.0,406.0 567.0,406.0 567.0,441.0" fill="none" stroke="#374151" stroke-width="1.3" marker-end="url(#arrow)"/><text x="432.0" y="401.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#b91c1c" font-style="italic">[dữ liệu không hợp lệ]</text><polyline points="631.0,461.5 646.0,461.5 646.0,238.8 184.0,238.8" fill="none" stroke="#374151" stroke-width="1.3" marker-end="url(#arrow)"/><polyline points="427.0,618.5 567.0,618.5 567.0,653.5" fill="none" stroke="#374151" stroke-width="1.3" marker-end="url(#arrow)"/><text x="432.0" y="599.5" font-size="11.5" font-weight="400" text-anchor="start" fill="#b91c1c" font-style="italic">[email hoặc số điện</text><text x="432.0" y="613.5" font-size="11.5" font-weight="400" text-anchor="start" fill="#b91c1c" font-style="italic">thoại đã tồn tại]</text><polyline points="631.0,674.0 660.0,674.0 660.0,238.8 184.0,238.8" fill="none" stroke="#374151" stroke-width="1.3" marker-end="url(#arrow)"/><circle cx="104" cy="64.0" r="10" fill="#111827"/><rect x="24.0" y="98" width="160" height="74.0" rx="11" fill="#fffbeb" stroke="#b45309" stroke-width="1.3"/><text x="104.0" y="116.1" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1f2937">Chọn Đăng ký, chọn</text><text x="104.0" y="131.6" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1f2937">loại tài khoản cá</text><text x="104.0" y="147.1" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1f2937">nhân hoặc doanh</text><text x="104.0" y="162.6" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1f2937">nghiệp</text><rect x="24.0" y="194.0" width="160" height="89.5" rx="11" fill="#fffbeb" stroke="#b45309" stroke-width="1.3"/><text x="104.0" y="212.1" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1f2937">Nhập họ tên, email,</text><text x="104.0" y="227.6" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1f2937">số điện thoại, mật</text><text x="104.0" y="243.1" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1f2937">khẩu; doanh nghiệp</text><text x="104.0" y="258.6" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1f2937">nhập thêm tên cửa</text><text x="104.0" y="274.1" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1f2937">hàng, mã số thuế</text><rect x="334.0" y="305.5" width="160" height="58.5" rx="11" fill="#fffbeb" stroke="#b45309" stroke-width="1.3"/><text x="414.0" y="323.6" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1f2937">Kiểm tra định dạng</text><text x="414.0" y="339.1" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1f2937">email, số điện thoại</text><text x="414.0" y="354.6" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1f2937">Việt Nam và mật khẩu</text><polygon points="414,393.0 427,406.0 414,419.0 401,406.0" fill="#ffffff" stroke="#374151" stroke-width="1.4"/><rect x="503.0" y="441.0" width="128" height="41" rx="11" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/><text x="567.0" y="458.2" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937">Báo lỗi ngay tại</text><text x="567.0" y="473.2" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937">trường sai</text><rect x="334.0" y="504.0" width="160" height="58.5" rx="11" fill="#fffbeb" stroke="#b45309" stroke-width="1.3"/><text x="414.0" y="522.1" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1f2937">Kiểm tra email và số</text><text x="414.0" y="537.6" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1f2937">điện thoại chưa được</text><text x="414.0" y="553.1" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1f2937">dùng</text><polygon points="414,605.5 427,618.5 414,631.5 401,618.5" fill="#ffffff" stroke="#374151" stroke-width="1.4"/><rect x="503.0" y="653.5" width="128" height="41" rx="11" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/><text x="567.0" y="670.7" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937">Báo đã được sử</text><text x="567.0" y="685.7" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937">dụng</text><rect x="334.0" y="716.5" width="160" height="89.5" rx="11" fill="#fffbeb" stroke="#b45309" stroke-width="1.3"/><text x="414.0" y="734.6" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1f2937">Băm mật khẩu</text><text x="414.0" y="750.1" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1f2937">(bcrypt) và lưu tài</text><text x="414.0" y="765.6" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1f2937">khoản: cá nhân</text><text x="414.0" y="781.1" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1f2937">ACTIVE, doanh nghiệp</text><text x="414.0" y="796.6" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1f2937">PENDING</text><rect x="334.0" y="828.0" width="160" height="89.5" rx="11" fill="#fffbeb" stroke="#b45309" stroke-width="1.3"/><text x="414.0" y="846.1" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1f2937">Cá nhân: cấp token,</text><text x="414.0" y="861.6" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1f2937">quay lại trang đang</text><text x="414.0" y="877.1" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1f2937">làm dở; doanh</text><text x="414.0" y="892.6" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1f2937">nghiệp: báo chờ</text><text x="414.0" y="908.1" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1f2937">duyệt</text><circle cx="414" cy="951.5" r="11" fill="#ffffff" stroke="#111827" stroke-width="1.6"/><circle cx="414" cy="951.5" r="6.5" fill="#111827"/></svg>