appId: host.exp.exponent
name: ADMIN thay trang quan tri voi 7 danh muc va so ban ghi that
tags:
  - smoke
---
- runFlow:
    file: subflows/login-ok.yaml
    env:
      USER_EMAIL: admin@edms.vn
- assertVisible: "Admin EDMS"
- assertVisible: "Người dùng"
- assertVisible: "Hub & bưu cục"
- assertVisible: "Tuyến"
- assertVisible: "Khu vực phục vụ"
- assertVisible: "Loại dịch vụ"
- assertVisible: "Bảng giá"
- extendedWaitUntil:
    visible: "\\d+ bản ghi"
    timeout: 15000
- takeScreenshot: 03-admin-trang-chu
# Danh muc thu 7 (Sprint 5, US-29) nam duoi cung
- scrollUntilVisible:
    element: "Điểm check-in"
    direction: DOWN
- assertVisible: "Tọa độ, bán kính tự check-in"
